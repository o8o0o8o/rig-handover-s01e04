# Plan morning-digest § 3/§ 4 (ADR 0003): save /digest/<night> as one HTML file and deploy it
# to GitHub Pages. The page is never committed. Run with an empty marker to take it off.
name: preview
on:
  workflow_dispatch:
    inputs:
      marker:
        description: LANE_MARKER for the banner (empty = "no marker set")
        required: false
        default: ''
      night:
        description: night to render
        required: false
        default: '2026-10-28'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pnpm install
      - name: save page
        env:
          LANE_MARKER: ${{ inputs.marker }}
          PORT: '8787'
        run: |
          pnpm start & sleep 5
          mkdir -p _site
          curl -fsS "http://localhost:8787/digest/${{ inputs.night }}" -o _site/index.html
          grep -o '<span class="marker">[^<]*</span>' _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site, retention-days: 1 }
      - id: d
        uses: actions/deploy-pages@v4
